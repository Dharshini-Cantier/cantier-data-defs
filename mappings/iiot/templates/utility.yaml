# Draft generated from workbook v3 by tools/import_workbook.py - edit by pull request from now on.
# IIoT TEMPLATE - tag list of one machine type. machines x tags = tag instances (check: scripts/04_check_coverage.py).
template: Utility
version: 0.1.0
mapping_version: iiot-map-2026.10.10
description: 'Utility machines: which tags they publish and what each tag measures.'
machines:
- AirCompressor01
- Boiler01
- CoolingWater01
patterns:
  uns_path: tyreplant01/{process_lc}/{line_lc}/{machine_lc}/{domain_lc}/{tag_lc}
  opc_node_id: ns=2;s=test.opc.Simulation.Site01.{process}.{line}.{machine}.{domain}.{tag}
  kepware_device: '{machine}_Device'
  kepware_tag: '{tag}'
tags:
