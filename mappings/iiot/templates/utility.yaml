  measurement_type: machine_state
  domain: State_Alarm
  data_type: string
  source_data_type: boolean
  unit: enum
  access: Read
  simulation_profile: State machine
  bronze_table: bronze.iiot_uns_events
  silver_table: silver.iiot_state_event
- tag_name: Alarm_Active
  measurement_type: alarm_active
  domain: State_Alarm
  data_type: boolean
