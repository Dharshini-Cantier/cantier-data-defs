- tag_name: Timestamp
  measurement_type: timestamp
  domain: Context
  data_type: timestamp
  unit: s
  access: Read
  simulation_profile: System timestamp
  bronze_table: bronze.iiot_uns_events
  silver_table: silver.mes_production_context
