area: Quality
version: 0.1.0
kpis:
- id: kpi_scrap_quantity_scrap
  number: 11
  name: Scrap Quantity & Scrap %
  description: Scrap by process, machine, product and shift.
  formula: SUM(scrap) / SUM(QuantityIn)
  grain: process × machine × SKU × shift
  mes_source_tables: LotActions, LotActionMachines, JobOrders, Shifts
  sources:
  - silver.mdm_shift_schedule
  - silver.mes_job_order
  - silver.mes_lot_action
  - silver.mes_lot_action_machine
  gold_table: gold.quality_scrap
  tyre_relevance: High
  owner: Quality owner (to confirm)
  status: draft
- id: kpi_ncm_trend
  number: 12
  name: NCM Trend
  description: Count of non-conformance records by day/week/month, held location and held code.
  formula: COUNT(NCM) BY period, held location, held code
  grain: day
  mes_source_tables: NCMHeaders, NCMTransactions, Processes
  sources:
  - silver.mdm_process
  - silver.qa_ncm
  gold_table: gold.ncm_summary
  tyre_relevance: High
  owner: Quality owner (to confirm)
  status: draft
- id: kpi_ncm_by_reason_failure_mode
  number: 13
