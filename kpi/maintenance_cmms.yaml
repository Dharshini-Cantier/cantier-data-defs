  - silver.cmms_parts_usage
  gold_table: gold.maintenance_kpi
  tyre_relevance: High
  owner: Maintenance (CMMS) owner (to confirm)
  status: draft
- id: kpi_technician_workload
  number: 39
  name: Technician Workload
  description: Work orders assigned per technician.
