# Draft generated from workbook v3 by tools/import_workbook.py - edit by pull request from now on.
# DATA QUALITY - checks each row of this table must pass. error = row rejected, warn = counted. (DQDL generation is B3.6)
table: silver.iiot_state_event
version: 0.1.0
rules:
- id: dq_iiot_state_event_pk_unique
  type: unique
  columns:
  - canonical_asset_id
  - ts_start
  severity: error
  description: One row per grain
- id: dq_iiot_state_event_canonical_asset_id_not_null
  type: not_null
  column: canonical_asset_id
  severity: error
- id: dq_iiot_state_event_ts_start_not_null
  type: not_null
  column: ts_start
  severity: error
- id: dq_iiot_state_event_state_valid
  type: accepted_values
  column: state
  values:
  - Stopped
  - Starting
  - Running
  - Idle
  - Down
  - Alarm
  severity: warn
- id: dq_iiot_state_event_asset_id_format
  type: pattern
  column: canonical_asset_id
  pattern: ^AST-[A-Z]{3}-\d{6}$
  severity: error
  description: Unresolved assets go to ops rejects, never into Silver
- id: dq_iiot_state_event_ts_start_before_ts_end
  type: expression
  check: ts_start <= ts_end
  severity: error
