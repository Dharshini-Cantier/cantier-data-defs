table: silver.iiot_tag_reading
version: 0.1.0
rules:
- id: dq_iiot_tag_reading_pk_unique
  type: unique
  columns:
  - canonical_asset_id
  - tag_name
  - event_ts_utc
  severity: error
  description: One row per grain
- id: dq_iiot_tag_reading_canonical_asset_id_not_null
  type: not_null
  column: canonical_asset_id
  severity: error
- id: dq_iiot_tag_reading_tag_name_not_null
  type: not_null
  column: tag_name
  severity: error
- id: dq_iiot_tag_reading_event_ts_utc_not_null
  type: not_null
  column: event_ts_utc
  severity: error
- id: dq_iiot_tag_reading_quality_valid
