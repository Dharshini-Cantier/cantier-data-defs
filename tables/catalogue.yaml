# Draft generated from workbook v3 by tools/import_workbook.py - edit by pull request from now on.
# TABLE CATALOGUE - all planned tables; specs for the rest arrive with the MES schema export (B2.6) and Gold design (AN).
version: 0.2.0
description: Every table planned in the Glue catalogue (sheet 12). has_spec = a full spec exists in tables/<layer>/.
tables:
  bronze.iiot_influx_extract:
    has_spec: true
    grain: one row per Influx point (POC)
    partition: days(_time)
    source: InfluxDB CSV export (query 2.csv)
    freshness: batch
    glossary_term_id: onto:entity/signal_reading
    format: ICEBERG / parquet zstd
  bronze.iiot_uns_events:
    has_spec: true
    grain: one row per UNS/MSK message
    partition: days(ingested_at), source_topic
    source: MSK via Firehose
    freshness: ≤ 5 min
    glossary_term_id: onto:entity/signal_reading
    format: ICEBERG / parquet zstd
  bronze.mes_cdc_template:
    has_spec: true
    grain: one row per change
    partition: days(dms_commit_ts)
    source: DMS from MES DB
    freshness: ≤ 15 min
    format: ICEBERG / parquet zstd
  bronze.cmms_cdc_template:
    has_spec: true
    grain: one row per change
    partition: days(dms_commit_ts)
    source: DMS from CMMS DB
    freshness: ≤ 15 min
    format: ICEBERG / parquet zstd
  silver.iiot_tag_reading:
    has_spec: true
    grain: one GOOD reading per signal per timestamp
    partition: days(event_ts_utc), site_id, area
    source: 'bronze.iiot_uns_events (POC: iiot_influx_extract)'
    freshness: ≤ 10 min
    glossary_term_id: onto:entity/signal_reading
    format: ICEBERG / parquet zstd
  ops.iiot_tag_reading_rejects:
    has_spec: true
    grain: one rejected bronze row
    partition: days(_ts_processed)
    source: Silver job
    freshness: ≤ 10 min
    format: ICEBERG / parquet zstd
  silver.iiot_state_event:
    has_spec: true
    grain: one state interval per asset
    partition: days(ts_start)
    source: Machine_State, Cure_PressStatus, Alarm_*, Emergency_Stop
    freshness: ≤ 10 min
    glossary_term_id: onto:entity/machine_state_event
    format: ICEBERG / parquet zstd
  silver.mes_production_cycle:
    has_spec: true
    grain: one cycle (batch/build/cure/inspection)
    partition: days(ts_start), area
    source: MES Edge events
    freshness: ≤ 10 min
    glossary_term_id: onto:entity/production_cycle
    format: ICEBERG / parquet zstd
  silver.qa_inspection_result:
    has_spec: true
    grain: one inspection per tyre
    partition: days(ts_inspected)
    source: Uniformity tester / QMS events
    freshness: ≤ 10 min
    glossary_term_id: onto:entity/inspection_result
    format: ICEBERG / parquet zstd
  silver.qa_measurement:
    has_spec: true
    grain: one measurement (long form, for SPC)
    partition: days(ts_event), measurement_type
    source: derived from qa_inspection_result + lab
    freshness: ≤ 10 min
    glossary_term_id: onto:entity/measurement
    format: ICEBERG / parquet zstd
  silver.mdm_asset:
    has_spec: true
    grain: one asset version (SCD2)
    partition: —
    source: MES MDM CDC + identity map
    freshness: daily
    glossary_term_id: onto:entity/asset
    format: ICEBERG / parquet zstd
  silver.mdm_spec_limit:
    has_spec: true
    grain: measurement_type × product × recipe version
    partition: —
    source: MES MDM
    freshness: daily
    glossary_term_id: onto:entity/spec_limit
    format: ICEBERG / parquet zstd
  silver.cmms_work_order:
    has_spec: true
    grain: one WO version
    partition: days(created_at)
    source: CMMS CDC
    freshness: ≤ 15 min
    glossary_term_id: onto:entity/maintenance_work_order
    format: ICEBERG / parquet zstd
  silver.pdm_prediction:
    has_spec: true
    grain: one prediction
    partition: days(scored_at)
    source: SageMaker output
    freshness: per scoring run
    glossary_term_id: onto:entity/prediction
    format: ICEBERG / parquet zstd
  gold.iiot_tag_5min:
    has_spec: true
    grain: asset × tag × 5-min window
